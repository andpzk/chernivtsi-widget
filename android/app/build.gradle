plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'ua.chernivtsi.electricity'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'ua.chernivtsi.electricity'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
